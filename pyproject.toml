[project]
name = "ops-copilot"
version = "0.1.0"
description = "Multi-agent operations copilot: LangGraph supervision over MCP-exposed tooling, with human approval gates and offline evals."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Tiwari" }]
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langchain-core>=1.3,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "mcp>=1.24,<2",
    "fastmcp>=2.12,<3",
    "litellm>=1.60,<2",
    "langchain-litellm>=0.3",
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.7.4,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "httpx>=0.27,<1",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "respx>=0.22,<1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_copilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# prompts.py lines sit inside triple-quoted prompt strings. Appending
# `# noqa: E501` to those lines would change the prompt bytes sent to the
# model and invalidate the eval baseline, so the ignore lives here instead.
"src/ops_copilot/graph/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/ops_copilot"]
